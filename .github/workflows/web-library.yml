name: Web Library
on:
  push:
    branches: [android-script-library]
    paths: [web-library/**, .github/workflows/web-library.yml]
  pull_request:
    paths: [web-library/**, .github/workflows/web-library.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and package
        working-directory: web-library
        run: |
          npm test
          npm run build
          npm run mod
          unzip -t dist/Script-Library-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Script-Library-Mod-Unsigned
          path: web-library/dist/Script-Library-unsigned.zip
