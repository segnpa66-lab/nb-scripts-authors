plugins { id 'com.android.application' }
android {
    namespace 'gg.nulls.library'
    compileSdk 35
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (System.getenv('RELEASE_KEYSTORE')) {
                storeFile file(System.getenv('RELEASE_KEYSTORE'))
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }
    defaultConfig {
        applicationId 'gg.nulls.library'
        minSdk 29
        targetSdk 34
        versionCode 25
        versionName '1.7.11'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { implementation 'androidx.core:core:1.13.1'; testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
